name: proyecto-monitoreo
x-backend: &backend
  build: ./backend
  networks: [monitoreo]
services:
  backend-1:
    <<: *backend
    environment:
      BACKEND_ID: backend-1
  backend-2:
    <<: *backend
    environment:
      BACKEND_ID: backend-2
  backend-3:
    <<: *backend
    environment:
      BACKEND_ID: backend-3
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend-1, backend-2, backend-3]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [monitoreo]
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    networks: [monitoreo]
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoreo]
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoreo]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoreo]
networks:
  monitoreo:
    driver: bridge
volumes:
  prometheus-data:
  grafana-data:

